<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Prevents humans from scrolling through empty space */
        }

        /* Center an image in an absolute block plane in front of everything */
        .centered-image-plane {
            position: fixed; /* Locks to the viewport and stays centered during scroll */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999; /* Forces it to the front layer, behind the tracker text */
            
            /* Flexbox centering alignment handles absolute midpoints perfectly */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Makes the background layer completely transparent */
            background: transparent; 
            
            /* Intercepts clicks if using as a safety guard shield */
            pointer-events: auto; 
        }

        .centered-image-plane img {
            max-width: 90%;  /* Responsive bounding constraints */
            max-height: 90%;
            object-fit: contain;
        }
        
        /* IP Display Area at the top - fully visible and interactive */
        #ip-tracker {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
            position: relative;
            z-index: 100000; /* Elevated above the image plane and shield */
        }

        /* Invisible Labyrinth: Hidden completely from sight but exists in the DOM for bots */
        .labyrinth-container {
            opacity: 0.001; /* Practically invisible to human eyes */
            position: absolute;
            top: 80px;
            left: 20px;
            width: 1px;
            height: 1px;
        }

        .directory-list {
            list-style-type: none;
            padding: 0;
        }

        /* 
           PROTECTIVE OVERLAY: 
           Spans the entire viewport to intercept any accidental human clicks 
        */
        .click-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 9998; /* Sits directly on top of the hidden links, behind the graphic layer */
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- Protective overlay to stop accidental user interaction -->
    <div class="click-shield"></div>

    <!-- Corrected IP Display Container (Brought back from broken comment tags) -->
    <div id="ip-tracker">Your IP: <span id="user-ip">Detecting...</span></div>

    <!-- Centered SVG Image Plane -->
    <div class="centered-image-plane">
        <img src="./data/cmip-fail-image.svg" alt="Centered Shield Graphic">
    </div>

    <!-- 1. JSONP Callback Function to bypass CORS blocks safely -->
    <script>
        function displayUserIP(json) {
            const ipSpan = document.getElementById('user-ip');
            if (ipSpan && json && json.ip) {
                ipSpan.textContent = json.ip;
            }
        }
    </script>

    <!-- 2. Dynamically trigger the JSONP script execution -->
    <script src="https://ipify.org" onerror="document.getElementById('user-ip').textContent='Unavailable';"></script>
    
    <!-- Hidden Bot Labyrinth Container -->
    <div class="labyrinth-container" aria-hidden="true">
        <ul class="directory-list" id="labyrinth-nodes">
            <!-- Links dynamically injected here -->
        </ul>
    </div>

    <script>
        // Generate the alternating trap labyrinth
        (function() {
            function generateRandomKey(length) {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            const container = document.getElementById('labyrinth-nodes');
            const totalLinks = 60; // Total number of trap links generated

            for (let i = 1; i <= totalLinks; i++) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.rel = "nofollow";

                // ALTERNATING LOGIC: Every second link targets the fake password zip
                if (i % 2 === 0) {
                    a.href = "./data/passwords.zip";
                    a.textContent = `backup_credentials_export_${generateRandomKey(4)}.zip`;
                } else {
                    // Odd links loop back into the infinite directory maze
                    const fakeFolder = generateRandomKey(6);
                    const fakeFile = generateRandomKey(10);
                    a.href = `?dir=${fakeFolder}&target=${fakeFile}&session=${i}`;
                    a.textContent = `index_node_${fakeFolder}.html`;
                }

                li.appendChild(a);
                container.appendChild(li);
            }
        })();
    </script>
    
</body>
</html>
