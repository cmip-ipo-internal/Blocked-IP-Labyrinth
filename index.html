<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Prevents humans from scrolling through empty space */
        }

        /* Center an image in an absolute block plane in front of everything */
        .centered-image-plane {
            position: fixed; /* Locks to the viewport and stays centered during scroll */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999; /* Forces it to the front layer, behind the tracker text */
            
            /* Flexbox centering alignment handles absolute midpoints perfectly */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Makes the background layer completely transparent */
            background: transparent; 
            
            /* Allows clicking past the container boundary background */
            pointer-events: none; 
        }

        .centered-image-plane img {
            max-width: 90%;  /* Responsive bounding constraints */
            max-height: 90%;
            object-fit: contain;
            pointer-events: auto; /* Re-enables interaction logic directly on the image graphic */
            
            /* GRAYSCALE FILTER APPLIED HERE */
            filter: grayscale(100%); 
            -webkit-filter: grayscale(100%); /* Safari support */
        }
        
        /* IP Link Area at the top - fully visible and interactive */
        #ip-tracker {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
            position: relative;
            z-index: 100000; /* Elevated above the image plane and click shield */
        }

        #ip-tracker a {
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
        }

        #ip-tracker a:hover {
            color: #004499;
        }

        /* Invisible Labyrinth: Hidden completely from sight but exists in the DOM for bots */
        .labyrinth-container {
            opacity: 0.001; /* Practically invisible to human eyes */
            position: absolute;
            top: 80px;
            left: 20px;
            width: 1px;
            height: 1px;
        }

        .directory-list {
            list-style-type: none;
            padding: 0;
        }

        /* 
           PROTECTIVE OVERLAY: 
           Spans from the top link downward to block accidental human clicks on the trap nodes
        */
        .click-shield {
            position: fixed;
            top: 50px; /* Starts just below the IP link so it remains fully clickable */
            left: 0;
            width: 100vw;
            height: calc(100vh - 50px);
            background: transparent;
            z-index: 9998; /* Sits directly on top of the hidden links, behind the graphic layer */
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- Protective overlay to stop accidental user interaction with the maze -->
    <div class="click-shield"></div>

    <!-- Updated interactive link to take users directly to their IP data -->
    <div id="ip-tracker">Your IP: <a href="https://icanhazip.com" target="_blank" rel="noopener noreferrer">Click to View</a></div>

    <!-- Centered SVG Image Plane (Filtered to Grayscale) -->
    <div class="centered-image-plane">
        <img src="./data/cmip-fail-image.svg" alt="Centered Shield Graphic">
    </div>
    
    <!-- Hidden Bot Labyrinth Container -->
    <div class="labyrinth-container" aria-hidden="true">
        <ul class="directory-list" id="labyrinth-nodes">
            <!-- Links dynamically injected here -->
        </ul>
    </div>

    <script>
        // Generate the alternating trap labyrinth
        (function() {
            function generateRandomKey(length) {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            const container = document.getElementById('labyrinth-nodes');
            const totalLinks = 60; // Total number of trap links generated

            for (let i = 1; i <= totalLinks; i++) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.rel = "nofollow";

                // ALTERNATING LOGIC: Every second link targets the fake password zip
                if (i % 2 === 0) {
                    a.href = "./data/passwords.zip";
                    a.textContent = `backup_credentials_export_${generateRandomKey(4)}.zip`;
                } else {
                    // Odd links loop back into the infinite directory maze
                    const fakeFolder = generateRandomKey(6);
                    const fakeFile = generateRandomKey(10);
                    a.href = `?dir=${fakeFolder}&target=${fakeFile}&session=${i}`;
                    a.textContent = `index_node_${fakeFolder}.html`;
                }

                li.appendChild(a);
                container.appendChild(li);
            }
        })();
    </script>
    
</body>
</html>
